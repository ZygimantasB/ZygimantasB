name: Generate Activity Graph

on:
  schedule:
    - cron: "30 1 * * *"  # Daily at 01:30 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/activity_graph.py"
      - ".github/workflows/activity-graph.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate graph
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ZygimantasB
        run: python scripts/activity_graph.py metrics/activity-graph.svg

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add metrics/activity-graph.svg
          git diff --staged --quiet && exit 0
          git commit -m "Update activity graph"
          git pull --rebase origin main
          git push
